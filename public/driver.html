<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EasyBike - Driver Dashboard</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Arial, sans-serif; }
        body, html { height: 100%; width: 100%; overflow: hidden; }
        
        .app-container { display: flex; flex-direction: column; height: 100vh; }
        
        #street-preview { flex: 1; width: 100%; background: #1a1a1a; position: relative; }
        #map { flex: 1; width: 100%; }

        @media (min-width: 768px) {
            .app-container { flex-direction: row; }
            #street-preview { width: 50%; height: 100%; }
            #map { width: 50%; height: 100%; }
        }

        .info-header {
            position: absolute;
            top: 10px;
            left: 10px;
            z-index: 1000;
            background: rgba(255, 255, 255, 0.95);
            padding: 8px 14px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.2);
            font-weight: bold;
            color: #1b5e20;
        }

        iframe { width: 100%; height: 100%; border: 0; }
    </style>
</head>
<body>

<div class="app-container">
    <!-- Google Street View Embed (Free View) -->
    <div id="street-preview">
        <div class="info-header">📍 Passenger Pickup Street View</div>
        <iframe id="street-frame" src="https://maps.google.com/maps?q=22.465832,89.008045&t=k&z=19&ie=UTF8&iwloc=&output=embed"></iframe>
    </div>
    
    <!-- Leaflet Interactive 3D/Hybrid Map -->
    <div id="map"></div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
    let map, marker;
    const initialCoords = [22.465832, 89.008045]; // Kaliganj / Basantapur area

    function initMap() {
        // Initialize Map
        map = L.map('map').setView(initialCoords, 16);

        // Google Hybrid Tile Layer (Satellite + Road Details)
        const googleHybrid = L.tileLayer('https://mt1.google.com/vt/lyrs=y&x={x}&y={y}&z={z}', {
            maxZoom: 20,
            subdomains: ['mt0', 'mt1', 'mt2', 'mt3'],
            attribution: '&copy; Google Maps'
        }).addTo(map);

        // Google Standard Streets Layer
        const googleStreets = L.tileLayer('https://mt1.google.com/vt/lyrs=m&x={x}&y={y}&z={z}', {
            maxZoom: 20,
            subdomains: ['mt0', 'mt1', 'mt2', 'mt3']
        });

        // Layer Toggle Switch
        L.control.layers({
            "Google Hybrid (3D Satellite)": googleHybrid,
            "Google Street Map": googleStreets
        }).addTo(map);

        // Marker for Passenger
        marker = L.marker(initialCoords).addTo(map).bindPopup("Passenger Location").openPopup();
    }

    // Function to update coordinates dynamically
    function updateLocation(lat, lng) {
        const newLatLng = [lat, lng];
        map.flyTo(newLatLng, 18);
        marker.setLatLng(newLatLng);

        // Update iframe for street/satellite view
        document.getElementById('street-frame').src = `https://maps.google.com/maps?q=${lat},${lng}&t=k&z=19&ie=UTF8&iwloc=&output=embed`;
    }

    window.onload = initMap;
</script>

</body>
</html>
