<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EasyBike - Street View & Map</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Arial, sans-serif; }
        body, html { height: 100%; width: 100%; overflow: hidden; }
        
        /* Main Container for Split Screen */
        .app-container { display: flex; flex-direction: column; height: 100vh; }
        
        /* Street View Top/Left Section */
        #street-view { flex: 1; width: 100%; background: #222; }
        
        /* Map Bottom/Right Section */
        #map { flex: 1; width: 100%; }

        /* Desktop Layout (Side-by-Side) */
        @media (min-width: 768px) {
            .app-container { flex-direction: row; }
            #street-view { width: 50%; height: 100%; }
            #map { width: 50%; height: 100%; }
        }

        .info-panel {
            position: absolute;
            top: 10px;
            left: 10px;
            z-index: 10;
            background: rgba(255, 255, 255, 0.9);
            padding: 10px 15px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.2);
            font-weight: bold;
            color: #1b5e20;
        }
    </style>
</head>
<body>

<div class="info-panel">📍 Passenger Pickup Location Street View</div>

<div class="app-container">
    <!-- Google Street View Container -->
    <div id="street-view"></div>
    
    <!-- Google Map Container -->
    <div id="map"></div>
</div>

<!-- Google Maps JS API (Replace YOUR_API_KEY with your key) -->
<script src="https://maps.googleapis.com/maps/api/js?key=YOUR_API_KEY&callback=initStreetViewMap" async defer></script>

<script>
    let map, panorama;

    function initStreetViewMap() {
        // Target Passenger Coordinates (Example: Basantapur / Kaliganj Area)
        const pickupLocation = { lat: 22.465832, lng: 89.008045 };

        // 1. Initialize Map
        map = new google.maps.Map(document.getElementById("map"), {
            center: pickupLocation,
            zoom: 16,
            mapTypeId: "roadmap"
        });

        // 2. Initialize Street View Panorama
        panorama = new google.maps.StreetViewPanorama(
            document.getElementById("street-view"),
            {
                position: pickupLocation,
                pov: { heading: 165, pitch: 0 },
                zoom: 1
            }
        );

        // Bind Street View to Map
        map.setStreetView(panorama);

        // Add Marker on Pickup Point
        new google.maps.Marker({
            position: pickupLocation,
            map: map,
            title: "Passenger Location"
        });
    }

    // Function to update position dynamically when driver selects a passenger
    function updatePassengerView(lat, lng) {
        const newPos = { lat: parseFloat(lat), lng: parseFloat(lng) };
        map.setCenter(newPos);
        panorama.setPosition(newPos);
    }
</script>

</body>
</html>
