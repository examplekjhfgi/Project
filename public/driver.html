<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ইজিবাইক - চালক ড্যাশবোর্ড</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body, html { margin: 0; padding: 0; height: 100%; overflow: hidden; font-family: 'Segoe UI', Arial, sans-serif; }
        .app-layout { display: flex; flex-direction: column; height: 100vh; }
        
        #map { flex: 1; width: 100%; }
        
        #passengerListPanel {
            height: 40vh;
            background: #ffffff;
            border-top-left-radius: 16px;
            border-top-right-radius: 16px;
            box-shadow: 0 -4px 15px rgba(0,0,0,0.15);
            padding: 15px;
            overflow-y: auto;
            z-index: 1000;
        }

        @media (min-width: 768px) {
            .app-layout { flex-direction: row; }
            #map { height: 100%; }
            #passengerListPanel { width: 380px; height: 100%; border-radius: 0; }
        }

        .passenger-card {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #f9f9f9;
            border: 1px solid #e0e0e0;
            border-radius: 12px;
            padding: 12px 15px;
            margin-bottom: 10px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .passenger-card:hover { background: #f0f7ed; border-color: #2e7d32; }

        .passenger-info { display: flex; align-items: center; gap: 12px; }
        .person-badge {
            background: #e8f5e9;
            color: #2e7d32;
            padding: 8px 12px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 15px;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .eta-time {
            text-align: right;
            font-weight: bold;
            color: #d84315;
            font-size: 15px;
        }
        .eta-time span { font-size: 12px; color: #666; display: block; font-weight: normal; }

        /* Custom Auto Marker Icon */
        .auto-marker-icon {
            background: #ffc107;
            border: 2px solid #000;
            border-radius: 50%;
            text-align: center;
            line-height: 28px;
            font-size: 18px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.3);
        }
    </style>
</head>
<body>

<div class="app-layout">
    <div id="map"></div>

    <div id="passengerListPanel">
        <h3 style="margin-top:0; color:#1b5e20;">🛺 যাত্রীদের রিকোয়েস্ট</h3>
        <div id="requestsList">
            <p style="color:#777; text-align:center;">আশেপাশে কোনো যাত্রী রিকোয়েস্ট করেনি...</p>
        </div>
    </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="/socket.io/socket.io.js"></script>
<script src="js/driver.js"></script>
</body>
</html>
